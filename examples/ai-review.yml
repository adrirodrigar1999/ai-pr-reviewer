# Copia este fichero en .github/workflows/ai-review.yml de tu repositorio
# y crea los secretos LLM_BASE_URL y LLM_API_KEY en Settings → Secrets and variables → Actions.
name: Revisión con IA

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # solo necesario si usas .ai-review.yml

      # Azure OpenAI (API v1): LLM_BASE_URL = https://<recurso>.openai.azure.com/openai/v1
      - uses: adrirodrigar1999/ai-pr-reviewer@v1
        with:
          llm-base-url: ${{ secrets.LLM_BASE_URL }}
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          llm-auth: api-key
          model: gpt-4o-mini # nombre del deployment
          fail-on: high # opcional: marca el check como fallido si hay hallazgos graves

      # A través de llm-gateway (control de coste y modelos por equipo):
      # - uses: adrirodrigar1999/ai-pr-reviewer@v1
      #   with:
      #     llm-base-url: https://mi-gateway.example.com/v1
      #     llm-api-key: ${{ secrets.LLM_GATEWAY_KEY }}
      #     model: gpt-4o-mini
