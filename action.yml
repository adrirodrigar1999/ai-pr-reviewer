name: "AI PR Reviewer"
description: "Revisa pull requests con un LLM y deja comentarios en las líneas con errores, riesgos de seguridad o tests ausentes."
author: "Adrián Rodríguez García"
branding:
  icon: eye
  color: blue

inputs:
  provider:
    description: "Vacío = usar llm-base-url/llm-api-key. 'ollama' = ejecutar un modelo abierto dentro del runner (gratis, sin claves, más lento)."
    default: ""
  ollama-model:
    description: "Modelo de Ollama cuando provider es 'ollama'."
    default: "qwen2.5-coder:3b"
  github-token:
    description: "Token para leer el PR y publicar la revisión."
    default: ${{ github.token }}
  llm-base-url:
    description: "URL base de una API compatible con OpenAI (Azure OpenAI v1, llm-gateway, OpenAI, Gemini, Ollama...). Sin ella, la revisión se omite con un aviso."
    default: ""
  llm-api-key:
    description: "Clave del proveedor del modelo (guárdala como secreto)."
    default: ""
  llm-auth:
    description: "Cómo enviar la clave: bearer (OpenAI, llm-gateway, Gemini...) o api-key (Azure OpenAI)."
    default: "bearer"
  model:
    description: "Modelo o nombre del deployment."
    default: "gpt-4o-mini"
  config-path:
    description: "Ruta del fichero de configuración del repositorio."
    default: ".ai-review.yml"
  max-diff-chars:
    description: "Tamaño máximo del diff enviado al modelo (caracteres)."
    default: "60000"
  fail-on:
    description: "Hace fallar el check si hay hallazgos de esta prioridad o mayor: none, low, medium, high."
    default: "none"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    # --- Modelo local con Ollama (solo si provider: ollama) ---------------------
    - name: Caché del modelo de Ollama
      if: inputs.provider == 'ollama'
      uses: actions/cache@v4
      with:
        path: ~/.ollama/models
        key: ollama-${{ runner.os }}-${{ inputs.ollama-model }}
    - name: Arrancar Ollama y descargar el modelo
      if: inputs.provider == 'ollama'
      shell: bash
      env:
        OLLAMA_MODEL: ${{ inputs.ollama-model }}
      run: |
        curl -fsSL https://ollama.com/download/ollama-linux-amd64.tgz | sudo tar zx -C /usr
        OLLAMA_CONTEXT_LENGTH=16384 OLLAMA_MODELS="$HOME/.ollama/models" nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
        for i in $(seq 1 30); do curl -sf http://localhost:11434/api/version >/dev/null && break; sleep 1; done
        OLLAMA_MODELS="$HOME/.ollama/models" ollama pull "$OLLAMA_MODEL"

    - name: Instalar el revisor
      shell: bash
      run: pip install --quiet --disable-pip-version-check "${{ github.action_path }}"
    - name: Revisar el pull request
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        LLM_BASE_URL: ${{ inputs.provider == 'ollama' && 'http://localhost:11434/v1' || inputs.llm-base-url }}
        LLM_API_KEY: ${{ inputs.provider == 'ollama' && 'ollama' || inputs.llm-api-key }}
        LLM_MODEL: ${{ inputs.provider == 'ollama' && inputs.ollama-model || inputs.model }}
        LLM_AUTH: ${{ inputs.provider == 'ollama' && 'bearer' || inputs.llm-auth }}
        LLM_TIMEOUT: ${{ inputs.provider == 'ollama' && '900' || '120' }}
        CONFIG_PATH: ${{ inputs.config-path }}
        MAX_DIFF_CHARS: ${{ inputs.provider == 'ollama' && inputs.max-diff-chars == '60000' && '24000' || inputs.max-diff-chars }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: python -m reviewer
